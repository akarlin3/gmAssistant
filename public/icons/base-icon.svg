<svg viewBox="0 0 200 200" width="512" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="averyNavyBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1b2842" />
      <stop offset="100%" stop-color="#121b2d" />
    </radialGradient>
    <linearGradient id="averyGoldPolished" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="averyGunmetalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="45%" stop-color="#475569" />
      <stop offset="80%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="averyGunmetalRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Square Base -->
  <rect x="4" y="4" width="192" height="192" rx="18" fill="url(#averyNavyBg)" />

  <!-- Outer Gold Chain-Link Perimeter -->
  <g>
    <rect
      x="10"
      y="10"
      width="180"
      height="180"
      rx="14"
      stroke="#d4af37"
      stroke-width="3.2"
      stroke-dasharray="6 3.5"
      stroke-linecap="round"
      opacity="0.92"
    />
    <rect
      x="13"
      y="13"
      width="174"
      height="174"
      rx="12"
      stroke="#fef08a"
      stroke-width="1"
      stroke-dasharray="3 6.5"
      stroke-linecap="round"
      opacity="0.65"
    />
  </g>

  <!-- Two Crossed Gold Chain Ellipses -->
  <g transform="rotate(-34 100 94)">
    <ellipse
      cx="100"
      cy="94"
      rx="68"
      ry="34"
      stroke="url(#averyGoldPolished)"
      stroke-width="6"
      stroke-dasharray="8 4.5"
      stroke-linecap="round"
    />
  </g>
  <g transform="rotate(34 100 94)">
    <ellipse
      cx="100"
      cy="94"
      rx="68"
      ry="34"
      stroke="url(#averyGoldPolished)"
      stroke-width="6"
      stroke-dasharray="8 4.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Two Interlocked Brushed-Gunmetal Mobius Bands -->
  <g transform="rotate(-18 88 92)">
    <ellipse
      cx="88"
      cy="92"
      rx="28"
      ry="48"
      stroke="url(#averyGunmetalLeft)"
      stroke-width="13"
    />
    <ellipse
      cx="88"
      cy="92"
      rx="28"
      ry="48"
      stroke="#cbd5e1"
      stroke-width="1.5"
      opacity="0.45"
    />
  </g>

  <g transform="rotate(18 112 92)">
    <ellipse
      cx="112"
      cy="92"
      rx="28"
      ry="48"
      stroke="url(#averyGunmetalRight)"
      stroke-width="13"
    />
    <ellipse
      cx="112"
      cy="92"
      rx="28"
      ry="48"
      stroke="#94a3b8"
      stroke-width="1.5"
      opacity="0.4"
    />
  </g>

  <!-- Foreground Polished Gold Ring -->
  <g transform="rotate(-24 108 106)">
    <ellipse
      cx="108"
      cy="106"
      rx="32"
      ry="44"
      stroke="#090d16"
      stroke-width="14.5"
      opacity="0.55"
    />
    <ellipse
      cx="108"
      cy="106"
      rx="32"
      ry="44"
      stroke="url(#averyGoldPolished)"
      stroke-width="11.5"
    />
    <ellipse
      cx="108"
      cy="106"
      rx="32"
      ry="44"
      stroke="#fef9c3"
      stroke-width="1.4"
      opacity="0.7"
    />
  </g>
</svg>
